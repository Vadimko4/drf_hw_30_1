[tool.poetry]
name = "hw-30-1"
version = "0.1.0"
description = ""
authors = ["vadimko4 <vad.informat@gmail.com>"]
readme = "README.md"
packages = [{include = "hw_30"}]

[tool.poetry.dependencies]
python = "^3.13"
django = "^5.2.6"
djangorestframework = "^3.16.1"
python-dotenv = "^1.1.1"
psycopg2-binary = "^2.9.10"
pillow = "^11.3.0"
ipython = "^9.6.0"
django-filter = "^25.1"
djangorestframework-simplejwt = "^5.5.1"
coverage = "^7.11.0"
drf-yasg = "^1.21.11"
stripe = "^13.1.1"
forex-python = "^1.9.2"
celery = "^5.5.3"
redis = "^7.1.0"
django-celery-beat = "^2.8.1"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
isort = "^6.0.1"
mypy = "^1.18.2"


[tool.isort]
line_length = 119


[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
